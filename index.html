<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b6bcb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/Icon192.svg">
<link rel="apple-touch-icon" href="assets/Icon192.svg">
<title>Tender Helper</title>
<style>
:root{--bg:#fff;--fg:#1b1f24;--mu:#667;--bd:#d6dae0;--ac:#0b6bcb;--card:#f6f8fa;--ok:#d9f2df;--wa:#fff1c2;--er:#fbd9d9}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--fg:#e6e8eb;--mu:#98a0aa;--bd:#2c323a;--ac:#5aa7ff;--card:#1c2127;--ok:#1d3a26;--wa:#4a3f14;--er:#4a2020}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:16px;max-width:1000px;margin-inline:auto}
h1{font-size:18px;margin:0 0 12px}input,select,textarea,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
textarea{width:100%;resize:vertical}input[type=text]{width:100%}button{cursor:pointer;background:var(--card)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.card{border:1px solid var(--bd);border-radius:8px;padding:10px;margin:10px 0;background:var(--card)}
.chip{font-size:12px;padding:1px 8px;border-radius:10px}.ok{background:var(--ok)}.wa{background:var(--wa)}.er{background:var(--er)}.mu{color:var(--mu);font-size:12px}
.cand{border-top:1px dashed var(--bd);padding:6px 0;display:flex;gap:8px;justify-content:space-between}.cand div{min-width:0}mark{background:var(--wa);color:inherit}
.grid{display:grid;grid-template-columns:90px 1fr;gap:6px;align-items:start;margin:6px 0}
</style>
</head>
<body>
<h1>Tender Helper</h1>
<div class="row"><select id="prod" style="flex:1;min-width:220px"></select><span id="info" class="mu"></span><button id="inst" hidden>Pasang aplikasi</button><button id="cfg">Pengaturan</button></div>
<div class="card">
  <div class="row"><b>Tambah satu persyaratan</b></div>
  <input type="text" id="p1" placeholder="Parameter, mis. Paper Speed">
  <textarea id="r1" rows="2" placeholder="Requirement, mis. Required; User-selectable paper speeds of 1, 2, and 3 cm/min."></textarea>
  <div class="row" style="margin-top:6px"><button class="p" id="add1">Tambah &amp; cari</button></div>
  <details><summary class="mu">Tempel banyak sekaligus: salin kolom B:C dari form, mulai dari baris yang sama dengan "Baris awal" di bawah (baris judul ikut disalin)</summary>
    <textarea id="bulk" rows="4"></textarea><button id="addN" style="margin-top:6px">Proses semua</button></details>
</div>
<div class="row"><button id="copy" class="p">Salin ke Excel (kolom D–H)</button><button id="csv">Unduh CSV</button><label class="mu">Baris awal di form <input type="number" id="start" value="6" style="width:64px"></label><label class="mu">Bahasa jawaban Gemini <select id="lang"><option value="en">English</option><option value="id">Indonesia</option></select></label></div>
<div class="row"><button id="fill" class="p">Isi ke Google Sheet form</button><button id="saveAll">Simpan semua ke Bank</button><button id="askAll">Gemini untuk semua yang kosong</button></div>
<div id="items"></div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbycL1BYgqGBSh-ZKq8knevCjOaj-sKtoCgbzu-D2rguu6k61SdcxUtMbNZP0PBwbyBRRA/exec'; // URL deployment Web app (berakhiran /exec)
const $ = id => document.getElementById(id);
const S = {prod:null, manual:null, ds:null, bank:[], items:[], idf:{}, docs:[], avg:1};
let TOKEN = localStorage.getItem('th_token') || '';

//#core-start
const STOP = new Set('the a an of to and or for with in on is are be can that this it as by from at user bidder specify must provide required requirement yes no may shall'.split(' '));
const tok = s => (String(s).toLowerCase().match(/[a-z0-9]{2,}/g) || []).filter(w => !STOP.has(w));
function buildIndex(pages){
  S.docs = pages.map(p => { const t = tok(p.text), tf = {}; t.forEach(w => tf[w] = (tf[w]||0)+1); return {tf, len: t.length}; });
  const df = {}; S.docs.forEach(d => Object.keys(d.tf).forEach(w => df[w] = (df[w]||0)+1));
  const N = S.docs.length; S.idf = {}; Object.keys(df).forEach(w => S.idf[w] = Math.log(1 + (N - df[w] + .5)/(df[w] + .5)));
  S.avg = S.docs.reduce((a,d) => a + d.len, 0)/Math.max(1,N);
}
function bm25(q){
  const qt = [...new Set(tok(q))];
  return S.docs.map((d,i) => { let s = 0; qt.forEach(w => { const f = d.tf[w]; if(f) s += S.idf[w]*f*2.5/(f + 1.5*(.25 + .75*d.len/S.avg)); }); return [s,i]; });
}
const isSpec = p => /specification|spesifikasi|technical (data|parameter)/i.test(p.text.split('\n').slice(0,3).join(' '));
function candidates(q){            // 5 teratas seluruh manual + 3 teratas dari halaman spesifikasi
  const sc = bm25(q).filter(x => x[0] > 0).sort((a,b) => b[0]-a[0]);
  const top = sc.slice(0,5).map(x => x[1]);
  const sp = sc.filter(x => isSpec(S.manual.pages[x[1]]) && !top.includes(x[1])).slice(0,3).map(x => x[1]);
  return top.concat(sp);
}
function snippet(text, q){
  const qt = [...new Set(tok(q))].sort((a,b) => (S.idf[b]||0)-(S.idf[a]||0));
  const low = text.toLowerCase(); let pos = -1;
  for(const w of qt){ pos = low.indexOf(w); if(pos >= 0) break; }
  const a = Math.max(0, pos < 0 ? 0 : pos - 70);
  return text.slice(a, a + 200).replace(/\n/g,' ');
}
function bestSentence(text, q){     // kalimat di halaman yang paling banyak memuat kata kunci persyaratan
  const qt = new Set(tok(q)); let best = '', bs = 0;
  (text.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]?/g) || []).forEach(x => {
    const t = x.trim(); if(t.length < 25) return; let sc = 0;
    new Set(tok(t)).forEach(w => { if(qt.has(w)) sc += S.idf[w] || 0; });
    if(sc > bs){ bs = sc; best = t; } });
  return best.slice(0, 300);
}
const jacc = (a,b) => { const A = new Set(tok(a)), B = new Set(tok(b)); let i = 0; A.forEach(w => B.has(w) && i++); return i/Math.max(1, A.size + B.size - i); };
function bankMatch(par, req){
  let best = null;
  S.bank.forEach(r => { const s = jacc(par+' '+req, r.parameter+' '+r.requirement); if(!best || s > best.s) best = {s, r}; });
  return best;
}
//#core-end

async function api(action, params={}, post=false){
  const body = Object.assign({action, token: TOKEN}, params);
  const r = post ? await fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)})
                 : await fetch(GAS_URL + '?' + new URLSearchParams(body));
  const j = await r.json(); if(!j.ok) throw new Error(j.error); return j;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label = p => p.cetak === '' ? 'PDF ' + p.pdf : String(p.cetak);

async function init(){
  if(!TOKEN){ TOKEN = prompt('Token (dari Execution log setupToken):') || ''; localStorage.setItem('th_token', TOKEN); }
  try{
    const [pr, bk] = await Promise.all([api('products'), api('bank')]);
    S.bank = bk.rows;
    $('prod').innerHTML = '<option value="">- pilih produk -</option>' + pr.products.map(p => `<option value="${esc(p.name)}">${esc(p.name)} ${p.datasheet?'[DS]':''}${p.manual?'[MB]':''}</option>`).join('');
  }catch(e){ $('info').textContent = 'Gagal memuat: ' + e.message; }
}
$('cfg').onclick = () => { const t = prompt('Token baru:', TOKEN); if(t !== null){ TOKEN = t; localStorage.setItem('th_token', t); location.reload(); } };
$('prod').onchange = async () => {
  S.prod = $('prod').value; S.manual = S.ds = null; S.items = []; render(); if(!S.prod) return;
  $('info').textContent = 'Memuat...';
  const [m, d] = await Promise.all([api('manual', {product:S.prod}).catch(e => ({err:e.message})), api('datasheet', {product:S.prod}).catch(e => ({err:e.message}))]);
  if(m.pages){ S.manual = m; buildIndex(m.pages); } if(d.lines) S.ds = d;
  $('info').textContent = (m.pages ? m.pages.length + ' hal. manual' : 'tanpa manual') + ' · ' + (d.lines ? d.lines.length + ' baris datasheet' : 'tanpa datasheet');
};

function parseTSV(t){ const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < t.length; i++){ const c = t[i];
    if(q){ if(c === '"'){ if(t[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"' && cur === '') q = true;
    else if(c === '\t'){ row.push(cur); cur = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && t[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c; }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); } return rows; }
function addItem(par, req, row, quiet){
  if(!S.prod){ alert('Pilih produk dulu'); return; }
  if(!req){ S.items.push({skip:true, par, row}); if(!quiet) render(); return; }   // baris judul: dilewati tapi tetap menjaga urutan
  const it = {par, req, row, yn:'', det:'', src:'', url:'', st:'none', cand:[], dsc:[], ref:null, msg:''};
  const q = par + ' ' + req, m = bankMatch(par, req);
  if(m && m.r.model === S.prod && m.s >= .35){ Object.assign(it, {yn:m.r.yesno, det:m.r.details, src:m.r.source, url:m.r.url || (S.manual && /^manual book/i.test(m.r.source) ? S.manual.url : ''), st: m.s >= .6 ? 'bank' : 'sim'}); }
  else if(m && m.s >= .5) it.ref = m.r;
  if(S.manual) it.cand = candidates(q);
  if(S.ds){ const qt = new Set(tok(q)); it.dsc = S.ds.lines.map(l => [tok(l.section+' '+l.text).filter(w => qt.has(w)).length, l]).filter(x => x[0] > 0).sort((a,b) => b[0]-a[0]).slice(0,3).map(x => x[1]); }
  S.items.push(it); if(!quiet) render();
}
$('add1').onclick = () => { if(!$('p1').value.trim() && !$('r1').value.trim()) return; addItem($('p1').value.trim(), $('r1').value.trim()); $('p1').value = $('r1').value = ''; };
$('addN').onclick = () => { if(!S.prod){ alert('Pilih produk dulu'); return; } const st = +$('start').value || 6;
  parseTSV($('bulk').value).forEach((c, i) => addItem((c[0]||'').trim(), (c[1]||'').trim(), st + i, true)); $('bulk').value = ''; render(); };

function render(){
  const chip = {bank:['ok','Dari Bank'], sim:['wa','Mirip Bank - periksa'], none:['er','Baru']};
  $('items').innerHTML = S.items.map((it,i) => it.skip ? `<div class="mu" style="margin:8px 0">▸ ${esc(it.par)} <i>(baris ${it.row}, judul - dilewati)</i></div>` : `<div class="card">
    <div class="row"><b>${esc(it.par)}</b>${it.row ? `<span class="mu">baris ${it.row}</span>` : ''}<span class="chip ${chip[it.st][0]}">${chip[it.st][1]}</span><button data-a="del" data-i="${i}" style="margin-left:auto">Hapus</button></div>
    <div class="mu" style="margin-bottom:6px">${esc(it.req)}</div>
    ${it.ref ? `<div class="mu">Contoh dari ${esc(it.ref.model)}: ${esc(it.ref.details)} <i>(nilai &amp; halaman khusus model itu)</i></div>` : ''}
    <div class="grid"><span>Ya/Tidak</span><select data-f="yn" data-i="${i}"><option value=""></option><option ${it.yn==='Yes'?'selected':''}>Yes</option><option ${it.yn==='No'?'selected':''}>No</option></select>
    <span>Details</span><textarea rows="2" data-f="det" data-i="${i}">${esc(it.det)}</textarea>
    <span>Sumber</span><input type="text" data-f="src" data-i="${i}" value="${esc(it.src)}">
    <span>URL</span><input type="text" data-f="url" data-i="${i}" value="${esc(it.url)}"></div>
    <div class="row"><button data-a="ask" data-i="${i}">Tanya Gemini</button><button class="p" data-a="save" data-i="${i}">Simpan ke Bank</button><span class="mu">${esc(it.msg)}</span></div>
    ${it.dsc.map((l,k) => `<div class="cand"><div><span class="mu">Datasheet · ${esc(l.section)}</span><br>${esc(l.text)}</div><button data-a="useds" data-i="${i}" data-k="${k}">Pakai</button></div>`).join('')}
    ${it.cand.map(pi => { const p = S.manual.pages[pi]; return `<div class="cand"><div><span class="mu">Manual hal. ${esc(label(p))}</span><br>${esc(bestSentence(p.text, it.par+' '+it.req) || snippet(p.text, it.par+' '+it.req))}</div><button data-a="usepg" data-i="${i}" data-k="${pi}">Pakai</button></div>`; }).join('')}
  </div>`).join('');
}
$('items').addEventListener('input', e => { const f = e.target.dataset.f; if(f) S.items[e.target.dataset.i][f === 'yn' ? 'yn' : f] = e.target.value; });
$('items').addEventListener('click', async e => {
  const a = e.target.dataset.a; if(!a) return; const i = +e.target.dataset.i, it = S.items[i];
  if(a === 'del'){ S.items.splice(i,1); return render(); }
  if(a === 'usepg'){ const p = S.manual.pages[+e.target.dataset.k], n = label(p);
    it.src = /^Manual Book Page/.test(it.src) ? it.src + ', ' + n : 'Manual Book Page ' + n; it.url = S.manual.url; if(!it.yn) it.yn = 'Yes'; if(!it.det || it.det === 'Yes, ') it.det = 'Yes, ' + (bestSentence(p.text, it.par + ' ' + it.req) || ''); it.st = it.st === 'bank' ? 'sim' : it.st; return render(); }
  if(a === 'useds'){ const l = it.dsc[+e.target.dataset.k]; it.yn = 'Yes'; it.det = 'Yes, ' + l.text.replace(' | ', ': ').replace(/ \| /g, ', '); it.src = 'Datasheet'; it.url = S.ds.url; return render(); }
  if(a === 'save'){ try{ await api('saveBank', {model:S.prod, parameter:it.par, requirement:it.req, yesno:it.yn, details:it.det, source:it.src, url:it.url}, true);
      S.bank = (await api('bank')).rows; it.msg = 'Tersimpan ke Bank'; }catch(err){ it.msg = err.message; } return render(); }
  if(a === 'ask'){ await askOne(it); render(); }
});
async function askOne(it){
  if(!it.cand.length){ it.msg = 'Tidak ada halaman kandidat'; return; } it.msg = 'Menunggu Gemini...'; render();
  try{ const r = await api('ask', {product:S.prod, parameter:it.par, requirement:it.req, pages: it.cand.slice(0,8).map(pi => S.manual.pages[pi].pdf), lang:$('lang').value}, true);
    if(r.status === 'Not found') it.msg = 'Gemini: tidak ditemukan bukti di halaman kandidat';
    else { it.yn = r.status; it.det = r.details; it.src = 'Manual Book Page ' + r.pages.join(', '); it.url = S.manual.url; it.msg = 'Usulan Gemini - periksa sebelum dipakai'; it.st = 'sim'; }
  }catch(err){ it.msg = err.message; } }
$('askAll').onclick = async () => { const L = S.items.filter(it => !it.skip && !it.det && it.cand.length);
  if(!L.length){ alert('Tidak ada persyaratan yang perlu ditanyakan'); return; } if(!confirm('Tanya Gemini untuk ' + L.length + ' persyaratan satu per satu? Bisa beberapa menit.')) return;
  for(const it of L) await askOne(it); render(); };
$('saveAll').onclick = async () => { const L = S.items.filter(it => !it.skip && (it.det || it.src)); let n = 0;
  for(const it of L){ try{ await api('saveBank', {model:S.prod, parameter:it.par, requirement:it.req, yesno:it.yn, details:it.det, source:it.src, url:it.url}, true); n++; it.msg = 'Tersimpan ke Bank'; }catch(e){ it.msg = e.message; } }
  S.bank = (await api('bank')).rows; render(); alert(n + ' jawaban tersimpan ke Bank'); };
$('fill').onclick = async () => { const rows = S.items.filter(it => !it.skip && it.row).map(it => ({row:it.row, yn:it.yn, details:it.det, source:it.src, url:it.url}));
  if(!rows.length){ alert('Belum ada baris bernomor. Gunakan "Tempel banyak sekaligus" dari form.'); return; }
  let u = prompt('Link Google Sheet form tender (hasil File > Save as Google Sheets):', localStorage.getItem('th_form') || ''); if(!u) return; localStorage.setItem('th_form', u);
  try{ const r = await api('fill', {url:u, rows}, true); alert('Terisi ' + r.written + ' baris' + (r.skipped.length ? '. Dilewati (baris judul gabungan): ' + r.skipped.join(', ') : '')); }catch(e){ alert(e.message); } };
const rowsTSV = () => S.items.map(it => it.skip ? ['','','','',''] : [it.yn==='No'?'':'√', it.yn==='No'?'x':'', it.det, it.src, it.url].map(c => String(c).replace(/[\t\n\r]+/g,' ')).join('\t')).join('\n');
$('copy').onclick = async () => { await navigator.clipboard.writeText(rowsTSV()); alert('Disalin. Tempel di sel D pada baris pertama form tender (urutan sama dengan daftar ini).'); };
$('csv').onclick = () => { const q = s => '"' + String(s ?? '').replace(/"/g,'""') + '"';
  const t = ['Parameter,Requirement,Ya/Tidak,Details,Sumber,URL'].concat(S.items.map(it => [it.par,it.req,it.yn,it.det,it.src,it.url].map(q).join(','))).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + t], {type:'text/csv'})); a.download = 'tender-' + (S.prod||'jawaban') + '.csv'; a.click(); };
let dp = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; $('inst').hidden = false; });
$('inst').onclick = async () => { if(!dp) return; dp.prompt(); await dp.userChoice; dp = null; $('inst').hidden = true; };
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
init();
</script>
</body>
</html>
